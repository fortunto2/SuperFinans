name: SuperFinans
options:
  bundleIdPrefix: app.superfinans
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "8N495BBBLM"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

packages:
  SuperDuperAiAuth:
    path: /Users/alina/projects/SuperDuperAi/packages/auth-ios

targets:
  SuperFinans:
    type: application
    platform: iOS
    sources:
      - path: SuperFinans
    resources:
      - path: SuperFinans/Resources/Content/en
        buildPhase: resources
      - path: SuperFinans/Resources/Content/ru
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.superfinans.SuperFinans
        INFOPLIST_KEY_CFBundleDisplayName: SuperFinans
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "SuperFinans uses Face ID for secure access"
        INFOPLIST_KEY_UIBackgroundModes: "remote-notification"
    dependencies:
      - package: SuperDuperAiAuth
    entitlements:
      path: SuperFinans/SuperFinans.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - "iCloud.app.superfinans"
        com.apple.developer.icloud-services:
          - "CloudKit"
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)$(CFBundleIdentifier)"

  SuperFinansTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SuperFinansTests
    dependencies:
      - target: SuperFinans
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SuperFinans.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SuperFinans"
