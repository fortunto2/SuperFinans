name: SuperFinans
fileGroups:
  - SuperFinans/Resources/Localizable.xcstrings
options:
  bundleIdPrefix: co.superduperai
  developmentLanguage: en
  knownRegions: [en, de, es, fr, it, ja, ko, pt-BR, ru, tr, zh-Hans, Base]
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: "8N495BBBLM"
    CODE_SIGN_IDENTITY: "8167B3F8652E51FF78636AE13E6BD5D097AB9B54"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

packages:
  SuperDuperAnalytics:
    path: ../../shared/superduperai-analytics

targets:
  SuperFinans:
    type: application
    platform: iOS
    sources:
      - path: SuperFinans
    resources:
      - path: SuperFinans/Resources/Localizable.xcstrings
        buildPhase: resources
      - path: SuperFinans/Resources/Content/en
        buildPhase: resources
      - path: SuperFinans/Resources/Content/ru
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.superduperai.SuperFinans
        TARGETED_DEVICE_FAMILY: "1"
        PROVISIONING_PROFILE_SPECIFIER: FreedomYear-App
        CODE_SIGN_IDENTITY: "8167B3F8652E51FF78636AE13E6BD5D097AB9B54"
        CODE_SIGN_STYLE: Manual
        INFOPLIST_KEY_CFBundleDisplayName: Freedom Year
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 3
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "SuperFinans uses Face ID for secure access"
        INFOPLIST_KEY_UIBackgroundModes: "remote-notification"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    dependencies:
      - package: SuperDuperAnalytics
      - target: SuperFinansWidgetExtension
    entitlements:
      path: SuperFinans/SuperFinans.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - "iCloud.co.superduperai.SuperFinans"
        com.apple.developer.icloud-services:
          - "CloudKit"
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)$(CFBundleIdentifier)"
        com.apple.security.application-groups:
          - "group.co.superduperai.SuperFinans"

  SuperFinansWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SuperFinansWidget
      - path: SuperFinans/Models/FreedomPlan.swift
      - path: SuperFinans/Extensions/Decimal+Financial.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.superduperai.SuperFinans.widget
        TARGETED_DEVICE_FAMILY: "1"
        PROVISIONING_PROFILE_SPECIFIER: FreedomYear-Widget
        CODE_SIGN_IDENTITY: "8167B3F8652E51FF78636AE13E6BD5D097AB9B54"
        CODE_SIGN_STYLE: Manual
        PRODUCT_NAME: SuperFinansWidget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 3
        SKIP_INSTALL: YES
    info:
      path: SuperFinansWidget/Info.plist
      properties:
        CFBundleDisplayName: Freedom
        CFBundleName: SuperFinansWidget
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundlePackageType: XPC!
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: SuperFinansWidget/SuperFinansWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - "group.co.superduperai.SuperFinans"

  SuperFinansTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SuperFinansTests
    dependencies:
      - target: SuperFinans
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SuperFinans.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SuperFinans"
